name: Hello Student Workflow

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  hello-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Greet and count files
        env:
          STUDENT_NAME: ${{ vars.STUDENT_NAME }}
        run: |
          if [ -z "$STUDENT_NAME" ]; then
            echo "Hello! It looks like the STUDENT_NAME variable is not set yet."
          else
            echo "Hello, $STUDENT_NAME!"
          fi